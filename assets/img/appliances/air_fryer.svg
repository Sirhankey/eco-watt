<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="16" fill="#0f172a"/>
  <!-- Corpo arredondado da Air Fryer -->
  <path d="M 32 30 C 32 20 88 20 88 30 L 92 84 C 92 98 28 98 28 84 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Tampa superior com display digital / botões -->
  <rect x="42" y="24" width="36" height="14" rx="4" fill="#090d16"/>
  <text x="60" y="34" font-family="monospace" font-size="7" fill="#f59e0b" font-weight="bold" text-anchor="middle">200°C</text>
  <!-- Gaveta do cesto -->
  <rect x="36" y="52" width="48" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <!-- Puxador da gaveta -->
  <rect x="55" y="60" width="10" height="18" rx="3" fill="#cbd5e1"/>
  <!-- Indicador de calor e turbina -->
  <circle cx="60" cy="45" r="3" fill="#ef4444"/>
</svg>
