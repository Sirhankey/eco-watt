<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="16" fill="#0f172a"/>
  <!-- Moldura fina gamer -->
  <rect x="18" y="22" width="84" height="54" rx="3" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  <!-- Display IPS -->
  <rect x="21" y="25" width="78" height="48" rx="1" fill="#1e293b"/>
  <!-- Imagem na tela / taxa 144Hz -->
  <text x="60" y="52" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold" text-anchor="middle">144 Hz</text>
  <!-- Braço do suporte ajustável -->
  <rect x="57" y="76" width="6" height="18" fill="#475569"/>
  <!-- Base em V gamer -->
  <path d="M 36 102 L 60 94 L 84 102" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
