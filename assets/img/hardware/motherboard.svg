<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="16" fill="#0f172a"/>
  <!-- Placa PCB verde escuro / preta -->
  <rect x="20" y="20" width="80" height="80" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <!-- Socket do Processador central -->
  <rect x="35" y="32" width="28" height="28" rx="2" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="42" y="39" width="14" height="14" fill="#334155"/>
  <!-- Slots de Memória RAM verticais -->
  <rect x="70" y="30" width="4" height="32" rx="1" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <rect x="76" y="30" width="4" height="32" rx="1" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <rect x="82" y="30" width="4" height="32" rx="1" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <!-- Slot PCIe da placa de vídeo horizontal -->
  <rect x="30" y="74" width="56" height="6" rx="1" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
  <!-- Dissipador VRM metálico -->
  <rect x="25" y="26" width="7" height="30" rx="1" fill="#64748b"/>
</svg>
