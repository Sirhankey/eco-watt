<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="16" fill="#0f172a"/>
  <!-- Gabinete Gamer Torre com lateral de vidro -->
  <rect x="22" y="20" width="76" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Janela de vidro temperado escurecido -->
  <rect x="28" y="26" width="56" height="68" rx="4" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
  <!-- Cooler da CPU com LED azul -->
  <circle cx="48" cy="48" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="48" cy="48" r="4" fill="#38bdf8"/>
  <!-- Placa de vídeo RGB com fan -->
  <rect x="34" y="68" width="46" height="16" rx="2" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="46" cy="76" r="5" fill="#090d16" stroke="#10b981" stroke-width="1"/>
  <circle cx="68" cy="76" r="5" fill="#090d16" stroke="#10b981" stroke-width="1"/>
  <!-- Painel frontal com botões e fans frontais -->
  <circle cx="89" cy="30" r="2" fill="#38bdf8"/>
  <rect x="88" y="38" width="2" height="40" rx="1" fill="#ec4899"/>
</svg>
